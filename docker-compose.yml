services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb-container
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e_trade
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql # Docker named volume, lưu dữ liệu MariaDB bền vững
    networks:
      - etrade-network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: etrade_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - etrade-network
    depends_on:
      - mariadb
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: remy4657/etrade-backend:latest
    container_name: etrade_backend
    depends_on:
      mariadb:
        condition: service_healthy
    # environment:
    #   SPRING_APPLICATION_NAME: shop
    #   SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/e_trade
    #   SPRING_DATASOURCE_USERNAME: root
    #   SPRING_DATASOURCE_PASSWORD: root # mat khau giong mat khau tren mysql
    ports:
      - "8080:8080" # trên local sẽ truy cập backend qua cổng 8080, bên trong container sẽ chạy trên cổng 8080
    networks:
      - etrade-network
networks:
  etrade-network:
    external: true
volumes:
  db_data:
    external: true # nghĩa là nói rằng volume db_data đã tồn tại rồi, dùng chính nó và không tạo mới nữa
    name: docker_db_data # ép etrade_be_db_data (là volume của container đang dùng) trỏ tới volume db_data
