services:
  mysql:
    image: mysql:8
    container_name: etrade_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root # len vps thay pass manh hon
      MYSQL_DATABASE: e_trade
    volumes:
      - java_etrade_mysql_data:/var/lib/mysql
    networks:
      - etrade-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: etrade_phpmyadmin
    ports:
      - "8081:80" # trên local: 8081, bên trong container: 80, len vps: "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql # chay cung 1 cong nen chi can ghi ten ra la duoc
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - etrade-network
    depends_on:
      - mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: remy4657/test-etrade-be-ci:latest
    container_name: etrade_backend
    environment:
      SPRING_APPLICATION_NAME: shop
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/e_trade
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root # mat khau giong mat khau tren mysql
    ports:
      - "8080:8080" # trên local sẽ truy cập backend qua cổng 8080, bên trong container sẽ chạy trên cổng 8080
    networks:
      - etrade-network
networks:
  etrade-network:
    external: true
volumes:
  java_etrade_mysql_data:
